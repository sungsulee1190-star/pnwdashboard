name: Review official competitor intelligence

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions: {}
concurrency:
  group: official-intelligence-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      snapshot_ready: ${{ steps.snapshot.outcome == 'success' }}
      collection_outcome: ${{ steps.update.outcome }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify dashboard and research behavior
        run: npm test
      - name: Verify ingestion behavior
        run: python3 tests/update-pipeline.test.py
      - name: Collect public official announcements
        id: update
        continue-on-error: true
        run: python3 scripts/update_intelligence.py
      - name: Retain news and collection diagnostics
        id: snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: official-intelligence-snapshot
          path: |
            intelligence/news.json
            intelligence/update-log.json
          if-no-files-found: error
          retention-days: 7
      - name: Surface collection failure after preserving diagnostics
        if: steps.update.outcome == 'failure'
        run: exit 1

  propose-update:
    needs: collect
    if: always() && needs.collect.outputs.snapshot_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: official-intelligence-snapshot
          path: intelligence
      - name: Create a review branch and draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: intelligence/update-${{ github.run_id }}-${{ github.run_attempt }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          COLLECTION_OUTCOME: ${{ needs.collect.outputs.collection_outcome }}
        run: |
          git add -- intelligence/news.json intelligence/update-log.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git switch -c "$UPDATE_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh official competitor announcements and collection status'
          git push origin "$UPDATE_BRANCH"
          cat > "$RUNNER_TEMP/intelligence-pr.md" <<'BODY'
          Refresh public official announcement titles, publication dates, and evidence links. `intelligence/update-log.json` records each source's attempt, successful fetch, publication freshness, and failures. Existing entries survive source failures; financial metrics and hand-researched company facts remain unchanged.

          Review the source status log and dated evidence before merging. This workflow does not merge or publish automatically.
          BODY
          python3 - <<'PY' >> "$RUNNER_TEMP/intelligence-pr.md"
          import json
          from pathlib import Path
          log = json.loads(Path('intelligence/update-log.json').read_text())
          print('\nCollection status: ' + log['status'])
          print('Successful sources: ' + str(sum(s['status'] == 'success' for s in log['sources'])))
          print('Failed sources: ' + str(sum(s['status'] == 'error' for s in log['sources'])))
          PY
          gh pr create --draft --base "$BASE_BRANCH" --head "$UPDATE_BRANCH" --title 'Refresh official competitor intelligence' --body-file "$RUNNER_TEMP/intelligence-pr.md"
      - name: Surface all-source failure
        if: needs.collect.outputs.collection_outcome == 'failure'
        run: exit 1
